services:
  geoapi:
    build: ./backend
    image: geo-measure-api:latest
    container_name: geoapi
    restart: unless-stopped
    init: true
    environment:
      GEO_CORS_ORIGINS: "https://geo.lverma.com,https://geo-measure-web.vercel.app"
      GEO_MAX_UPLOAD_BYTES: "26214400"
      GEO_MAX_ZIP_BYTES: "67108864"
      GEO_RETENTION_DAYS: "7"
    volumes:
      # ./data resolves to the checkout, so a fresh clone works without edits;
      # deploy.sh chowns it to the uid the container runs as.
      - ./data:/data
    # Peak memory scales with the expanded archive, so the cap sits above the
    # worst case the 64 MB zip budget can produce.
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - personal-apps
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"

networks:
  personal-apps:
    # The Caddy reverse proxy lives in the personal-apps stack; joining its network
    # lets it reach this container by name without publishing a port on the host.
    external: true
    name: personal-apps_default
