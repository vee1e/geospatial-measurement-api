<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geo Measure — shapefile and KML measurements</title>
    <meta
      name="description"
      content="Upload a zipped Shapefile or a KML and read per-feature area and length measurements."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='%23fff' stroke-width='2'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23000' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <input id="file-input" type="file" accept=".zip,.kml" hidden />

    <header class="site-head">
      <a class="wordmark" href="/">geo<span class="wordmark-dot">·</span>measure</a>
      <nav class="head-links">
        <a href="https://geo-api.lverma.com/docs" target="_blank" rel="noreferrer">api</a>
        <a href="https://github.com/vee1e/geospatial-measurement-api" target="_blank" rel="noreferrer">source</a>
      </nav>
    </header>

    <main>
      <div class="topline">
        <h1>Measure a survey file.</h1>
        <p class="lede">Areas in square metres, lengths in metres.</p>
      </div>

      <div class="stage">
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file to upload">
          <div class="drop-inner">
            <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V4m0 0L7 9m5-5 5 5" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <p class="drop-title">No file loaded.</p>
            <p class="drop-hint">drop a zipped Shapefile or a kml · up to 25 MB</p>
          </div>
        </div>

        <div class="readout" id="readout" hidden>
          <div class="readout-cell">
            <p class="readout-label">area</p>
            <p class="readout-value"><span id="area-value">0</span><span class="readout-unit">m²</span></p>
            <p class="readout-sub" id="area-sub">—</p>
          </div>
          <div class="readout-cell">
            <p class="readout-label">length</p>
            <p class="readout-value"><span id="length-value">0</span><span class="readout-unit">m</span></p>
            <p class="readout-sub" id="length-sub">—</p>
          </div>
          <div class="readout-cell">
            <p class="readout-label">projection</p>
            <p class="readout-code" id="calc-crs">—</p>
            <p class="readout-sub" id="crs-note">—</p>
          </div>
        </div>

        <div class="features" id="features" hidden>
          <div class="features-head">
            <h2>Features</h2>
            <div class="head-right">
              <p class="features-count" id="features-count"></p>
              <button class="link-button" id="new-file" type="button">new file</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col" class="col-index">#</th>
                  <th scope="col" class="col-geom">geometry</th>
                  <th scope="col">attributes</th>
                  <th scope="col" class="col-num">measurement</th>
                </tr>
              </thead>
              <tbody id="feature-rows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="status" id="status" hidden>
        <div class="status-rail" id="status-rail"></div>
        <p class="status-message" id="status-message"></p>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
